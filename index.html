<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d18">
<title>Mon IA Privée</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#121a2b;--panel2:#19243a;--line:#283653;--purple:#7657ff;--text:#f4f5ff;--muted:#a8b2ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#090d18ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 12px}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:27px;color:#9c82ff}main{max-width:760px;margin:auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--purple);color:white;font-weight:650}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#6f2537}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.stack{display:flex;flex-direction:column;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.charcard{padding:0;overflow:hidden;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px}.charimg{width:100%;height:145px;object-fit:cover;background:var(--panel2);display:block}.charbody{padding:12px}.charbody strong{display:block;margin-bottom:5px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:14px;color:#dce3f6;font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1221;color:var(--text);padding:12px;outline:none}.field textarea{resize:vertical;min-height:85px}.field textarea.desc{min-height:180px}.counter{text-align:right;color:var(--muted);font-size:12px}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.avatar{width:40px;height:40px;object-fit:cover;border-radius:12px;background:var(--panel2)}.chathead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.messages{display:flex;flex-direction:column;gap:10px;margin:12px 0 18px}.bubble{max-width:88%;padding:12px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.bubble.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}.bubble.user{align-self:flex-end;background:#6344e8}.composer{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%)}.composer .row{align-items:flex-end}.composer textarea{flex:1;min-height:46px;max-height:120px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:white;padding:12px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#0d1424f2;border-top:1px solid var(--line)}.nav button{background:none;border:0;color:var(--muted);padding:6px;font-size:13px}.nav button.active{color:#b6a6ff}.notice{background:#302515;border:1px solid #715529;color:#ffe3a4;border-radius:12px;padding:12px;font-size:13px;line-height:1.4}.empty{text-align:center;padding:45px 16px}.empty .logo{font-size:54px}.status{font-size:12px;color:var(--muted)}@media(min-width:600px){.charimg{height:190px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">∞</span><div><h1>Mon IA Privée</h1><div class="status" id="status">Personnages enregistrés sur cet appareil</div></div></div><button class="btn secondary" id="settingsBtn" aria-label="Réglages">⚙️</button></header>
<main id="app"></main>
<nav class="nav"><button class="active" data-page="home">⌂<br>Personnages</button><button data-page="settings">⚙<br>Réglages IA</button><button data-page="privacy">♙<br>Confidentialité</button></nav>
<script>
const STORE='monIAPrive_v1', SETTINGS='monIAPrive_settings_v1';
let chars=[],settings={apiKey:'',model:'openrouter/free',nsfw:false,gore:false,customInstructions:''},page='home',activeId=null,editId=null,busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{chars=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{chars=[]}try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch{}}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(chars));$('#status').textContent='Sauvegardé sur cet appareil'}catch(e){alert('Stockage plein. Essaie une photo plus petite ou exporte tes données.');}}
function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(settings))}
function getChar(id){return chars.find(c=>c.id===id)}
function avatar(c,cls='avatar'){return c.photo?`<img class="${cls}" src="${c.photo}" alt="">`:`<div class="${cls}" style="display:grid;place-items:center;color:#a995ff;font-size:22px">♙</div>`}
function render(){
 const app=$('#app');
 if(page==='home') app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:16px"><div><h2>Mes personnages</h2><div class="muted">Crée ton univers, à ta façon.</div></div><button class="btn" id="newBtn">＋ Créer</button></div>
 ${chars.length?`<div class="grid">${chars.map(c=>`<button class="charcard" data-open="${c.id}">${c.photo?`<img class="charimg" src="${c.photo}" alt="">`:`<div class="charimg" style="display:grid;place-items:center;font-size:45px;color:#9c82ff">♙</div>`}<div class="charbody"><strong>${esc(c.name)}</strong><div class="muted">${esc(c.description).slice(0,105)}${c.description.length>105?'…':''}</div><div class="muted" style="margin-top:9px">${(c.messages||[]).length} messages</div></div></button>`).join('')}</div>`:`<div class="card empty"><div class="logo">∞</div><h2>Crée ton premier chatbot</h2><p class="muted">Ajoute son nom, sa salutation, sa personnalité et sa photo.</p><button class="btn" id="newBtn2">Créer mon chatbot</button></div>`}`;
 if(page==='editor') renderEditor();
 if(page==='chat') renderChat();
 if(page==='settings') renderSettings();
 if(page==='privacy') renderPrivacy();
}
function renderEditor(){
 const c=editId?getChar(editId):null;
 $('#app').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${c?'Modifier le personnage':'Créer un chatbot'}</h2><button class="btn secondary" id="backBtn">Retour</button></div>
 <form id="characterForm"><div class="field"><label for="name">Nom du personnage *</label><input id="name" maxlength="100" required value="${esc(c?.name||'')}" placeholder="Ex. Gary Smith"></div>
 <div class="field"><label for="greeting">Salutation / premier message *</label><textarea id="greeting" maxlength="3000" required placeholder="Ex. Salut… Je suis Gary. Content de te voir ici.">${esc(c?.greeting||'')}</textarea><div class="counter" id="greetCount"></div></div>
 <div class="field"><label for="description">Description et personnalité *</label><textarea class="desc" id="description" maxlength="32000" required placeholder="Décris son caractère, son passé, ses goûts, sa façon de parler, ses relations…">${esc(c?.description||'')}</textarea><div class="counter" id="descCount"></div></div>
 <div class="field"><label for="photo">Photo du personnage</label><input id="photo" type="file" accept="image/*"><div class="muted">Choisis une image dans Photos. Elle est redimensionnée pour économiser l'espace.</div><div id="photoPreview">${c?.photo?`<img src="${c.photo}" style="width:120px;height:120px;object-fit:cover;border-radius:16px">`:''}</div><button type="button" class="btn secondary ${c?.photo?'':'hidden'}" id="removePhoto">Retirer la photo</button></div>
 <div class="actions"><button class="btn" type="submit">Enregistrer le personnage</button><button class="btn secondary" type="button" id="cancelEdit">Annuler</button></div></form>`;
 let photo=c?.photo||null;
 const updateCounts=()=>{$('#greetCount').textContent=$('#greeting').value.length+'/3000';$('#descCount').textContent=$('#description').value.length+'/32000 caractères';};
 updateCounts();$('#greeting').addEventListener('input',updateCounts);$('#description').addEventListener('input',updateCounts);
 $('#photo').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;photo=await shrinkImage(f);$('#photoPreview').innerHTML=`<img src="${photo}" style="width:120px;height:120px;object-fit:cover;border-radius:16px">`;$('#removePhoto').classList.remove('hidden')});
 $('#removePhoto').onclick=()=>{photo=null;$('#photoPreview').innerHTML='';$('#removePhoto').classList.add('hidden');$('#photo').value=''};
 $('#backBtn').onclick=$('#cancelEdit').onclick=()=>{page='home';editId=null;render()};
 $('#characterForm').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim(),greeting=$('#greeting').value.trim(),description=$('#description').value;if(!name||!greeting||!description)return;const obj={id:c?.id||crypto.randomUUID(),name,greeting,description,photo,messages:c?.messages||[],created:c?.created||Date.now()};if(c)chars=chars.map(x=>x.id===c.id?obj:x);else chars.unshift(obj);persist();editId=null;page='home';render()};
}
function shrinkImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,700/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function renderChat(){
 const c=getChar(activeId);if(!c){page='home';render();return}
 $('#app').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="chathead">${avatar(c)}<div><h2 style="margin:0">${esc(c.name)}</h2><div class="muted">Conversation privée sur cet appareil</div></div></div><div class="actions"><button class="btn secondary" id="editBtn">Modifier</button><button class="btn secondary" id="backBtn">←</button></div></div>
 <div class="notice" style="margin-bottom:12px">Les messages sont sauvegardés ici. Pour générer une réponse, le message et la fiche du personnage seront envoyés au fournisseur IA configuré.</div>
 <div id="messages" class="messages">${c.messages.length?c.messages.map(m=>`<div class="bubble ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join(''):`<div class="bubble bot">${esc(c.greeting)}</div>`}</div>
 <div class="composer"><div class="row"><textarea id="messageInput" placeholder="Écris ton message…"></textarea><button class="btn" id="sendBtn" style="height:46px">➤</button></div><div class="muted" style="margin:7px 4px">Réponses IA en ligne · Historique local</div></div>`;
 $('#backBtn').onclick=()=>{page='home';render()};$('#editBtn').onclick=()=>{editId=c.id;page='editor';render()};
 const send=()=>sendMessage(c.id);$('#sendBtn').onclick=send;$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
 $('#messages').scrollTop=$('#messages').scrollHeight;
}
async function sendMessage(id){
 if(busy)return;const c=getChar(id),input=$('#messageInput'),text=input.value.trim();if(!c||!text)return;
 if(!settings.apiKey){alert('Ajoute une clé API dans Réglages IA pour activer les réponses.');page='settings';render();return}
 c.messages.push({role:'user',text,at:Date.now()});persist();busy=true;renderChat();$('#sendBtn').disabled=true;$('#sendBtn').textContent='…';
 try{
  const history=c.messages.slice(-16).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
  const modeRules=[
 settings.nsfw ? "Thèmes adultes : les personnages impliqués dans des scènes sexuelles doivent être explicitement adultes et consentants. Tu peux adopter un ton romantique ou sensuel selon le contexte, sans sexualiser les mineurs ni présenter une agression sexuelle comme consentie ou érotique." : "Garde les scènes sexuelles explicites désactivées ; privilégie une romance non explicite.",
 settings.gore ? "Horreur et violence fictives : tu peux décrire des scènes sombres, des blessures, du sang, des maladies et leurs conséquences psychologiques de façon narrative, en respectant le ton demandé. Ne transforme pas la violence sexuelle en contenu érotique et ne donne pas d'instructions réelles pour blesser quelqu'un." : "Limite les descriptions graphiques de violence ; privilégie le suspense et l'horreur suggérée."
].join("\n");
  const system=`Tu incarnes le personnage ${c.name}. Respecte cette description comme référence principale :\n${c.description}\n\nSalutation initiale du personnage : ${c.greeting}\nRéponds en français avec des phrases complètes, naturelles et cohérentes. Reste fidèle à sa personnalité, son passé, son vocabulaire et ses relations. Fais avancer la scène sans répéter inutilement.\n\nPréférences de contenu de l'utilisateur :\n${modeRules}\n\nInstructions personnalisées : ${settings.customInstructions||'Aucune'}`;
  const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+settings.apiKey,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'Mon IA Privée'},body:JSON.stringify({model:settings.model||'openrouter/free',messages:[{role:'system',content:system},...history],temperature:0.85,max_tokens:600,stream:false})});
  const data=await res.json();if(!res.ok)throw new Error(data?.error?.message||`Erreur API (${res.status})`);
  const reply=data.choices?.[0]?.message?.content;if(!reply)throw new Error('Le modèle n’a renvoyé aucune réponse.');
  getChar(id).messages.push({role:'assistant',text:reply,at:Date.now()});persist();
 }catch(err){getChar(id).messages.push({role:'assistant',text:'[Erreur de génération] '+err.message,at:Date.now()});persist()}
 finally{busy=false;renderChat()}
}
function renderSettings(){
 $('#app').innerHTML=`<h2>Réglages IA</h2><div class="notice">Les modes ci-dessous ajustent les instructions envoyées au modèle. Ils ne suppriment pas les règles ou limites du fournisseur. Utilise les thèmes adultes uniquement avec des personnages adultes.</div>
 <div class="card stack" style="margin-top:12px">
 <label class="row" style="justify-content:space-between"><span><strong>Mode NSFW / thèmes adultes</strong><div class="muted">Romance et ton sensuel entre adultes consentants.</div></span><input id="nsfwMode" type="checkbox" ${settings.nsfw?'checked':''} style="width:24px;height:24px"></label>
 <label class="row" style="justify-content:space-between"><span><strong>Mode Gore / horreur</strong><div class="muted">Horreur fictive, blessures, sang, maladies et conséquences psychologiques.</div></span><input id="goreMode" type="checkbox" ${settings.gore?'checked':''} style="width:24px;height:24px"></label>
 <div class="field"><label for="customInstructions">Instructions personnalisées</label><textarea id="customInstructions" maxlength="6000" placeholder="Ex. Réponses détaillées, ambiance sombre, narration à la troisième personne…">${esc(settings.customInstructions||'')}</textarea><div class="muted">Jusqu'à 6 000 caractères. Ces consignes sont ajoutées à chaque demande.</div></div>
 </div>
 <div class="field"><label for="apiKey">Clé API OpenRouter</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-v1-…" value="${esc(settings.apiKey)}"><div class="muted">Stockée dans Safari sur cet iPhone. Ne partage pas cette clé et ne l'inscris jamais dans le code public.</div><a href="https://openrouter.ai/keys" target="_blank" rel="noopener" style="color:#b6a6ff">Créer / gérer une clé OpenRouter ↗</a></div>
 <div class="field"><label for="model">Modèle</label><input id="model" value="${esc(settings.model||'openrouter/free')}" placeholder="openrouter/free"><div class="muted">Le modèle gratuit peut avoir des limites de contenu et de quota.</div><a href="https://openrouter.ai/models?max_price=0" target="_blank" rel="noopener" style="color:#b6a6ff">Voir les modèles gratuits ↗</a></div>
 <div class="actions"><button class="btn" id="saveSettings">Enregistrer tous les réglages</button><button class="btn secondary" id="testBtn">Tester la connexion</button></div><div id="testResult" class="muted" style="margin-top:12px"></div>`;
 const save=()=>{settings.apiKey=$('#apiKey').value.trim();settings.model=$('#model').value.trim()||'openrouter/free';settings.nsfw=$('#nsfwMode').checked;settings.gore=$('#goreMode').checked;settings.customInstructions=$('#customInstructions').value.trim();saveSettings()};
 $('#saveSettings').onclick=()=>{save();$('#testResult').textContent='Réglages enregistrés sur cet appareil.'};
 $('#testBtn').onclick=async()=>{save();$('#testResult').textContent='Test en cours…';try{const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+settings.apiKey,'Content-Type':'application/json'},body:JSON.stringify({model:settings.model,messages:[{role:'user',content:'Réponds uniquement : Connexion réussie.'}],max_tokens:20})});const d=await r.json();$('#testResult').textContent=r.ok?'Connexion réussie : '+(d.choices?.[0]?.message?.content||'réponse reçue'):'Échec : '+(d.error?.message||r.status)}catch(e){$('#testResult').textContent='Erreur réseau : '+e.message}};
}
function renderPrivacy(){
 $('#app').innerHTML=`<h2>Confidentialité & sauvegardes</h2><div class="card stack"><strong>Ce qui reste sur ton iPhone</strong><div class="muted">Les personnages, photos, descriptions et historiques sont conservés dans le stockage local du navigateur. Ils ne se synchronisent pas automatiquement entre appareils.</div><strong>Ce qui part sur Internet</strong><div class="muted">Quand tu envoies un message, l'application transmet la description du personnage et les derniers messages au fournisseur IA afin qu'il génère une réponse. Consulte ses conditions de confidentialité avant de partager des informations sensibles.</div><strong>Important</strong><div class="muted">Le stockage local n'est pas un coffre-fort : quelqu'un ayant accès à ton iPhone déverrouillé peut potentiellement ouvrir l'app. Effacer les données de Safari peut supprimer les personnages. Exporte régulièrement une sauvegarde.</div><div class="actions"><button class="btn" id="exportBtn">Exporter une sauvegarde</button><label class="btn secondary" for="importFile" style="display:inline-flex;align-items:center">Importer une sauvegarde</label><input id="importFile" type="file" accept="application/json" class="hidden"></div><button class="btn danger" id="clearBtn">Supprimer toutes les données locales</button></div>`;
 $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,characters:chars,settings:{model:settings.model}},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mon-ia-privee-sauvegarde.json';a.click();URL.revokeObjectURL(url)};
 $('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.characters))throw Error('Fichier invalide');if(confirm('Remplacer les personnages actuels par la sauvegarde ?')){chars=d.characters;persist();page='home';render()}}catch(err){alert('Import impossible : '+err.message)}};
 $('#clearBtn').onclick=()=>{if(confirm('Supprimer définitivement les personnages, photos et conversations stockés dans ce navigateur ?')){chars=[];persist();page='home';render()}};
}
$('#settingsBtn').onclick=()=>{page='settings';render()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;activeId=null;editId=null;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){activeId=open.dataset.open;page='chat';render()}if(e.target.id==='newBtn'||e.target.id==='newBtn2'){editId=null;page='editor';render()}});
load();render();
</script>
</body>
</html>

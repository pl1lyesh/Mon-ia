<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Mon IA Privée</title>
<style>
.message-row{display:flex;align-items:flex-start;gap:6px;width:100%}
.message-row.user-row{justify-content:flex-end}
.message-row.bot-row{justify-content:flex-start}
.message-row .bubble{flex:0 1 auto;min-width:0;max-width:calc(100% - 42px)}
.copy-btn{flex:0 0 34px;width:34px;height:34px;margin-top:5px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);font-size:16px;line-height:1}
.copy-btn:active{transform:scale(.94)}
.copy-btn.copied{color:#8ff0b0;border-color:#368654}
button,label.btn,.nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#111111;--panel:#1d1d1d;--panel2:#262626;--line:#3a3a3a;--purple:#7657ff;--text:#ffffff;--muted:#a3a3a3;--user-bubble:#6344e8;--bot-bubble:var(--panel2);--roleplay:#a3a3a3;--roleplay-opacity:.78;--dialogue-weight:600;--chat-bg-image:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--chat-bg-image);background-size:cover;background-position:center;background-attachment:fixed;color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
h2{font-size:18px;margin:0 0 12px}
main{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(var(--navh,74px) + 16px)}
.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--purple);color:#fff;font-weight:650}
.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:#6f2537}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.muted{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}
.field label{font-size:14px;color:var(--text);font-weight:600}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:12px;outline:none}
.field textarea{resize:vertical;min-height:85px}
.field textarea.desc{min-height:180px}
.counter{text-align:right;color:var(--muted);font-size:12px}
.hidden{display:none!important}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.messages{display:flex;flex-direction:column;gap:10px;margin:12px 0 18px}
.bubble{max-width:92%;padding:12px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;word-break:normal}
.bubble.bot{align-self:flex-start;background:var(--bot-bubble);border:1px solid var(--line);color:var(--text);box-shadow:0 3px 12px #0002}
.bubble.user{align-self:flex-end;background:var(--user-bubble);color:#fff}
.bubble .speech{font-weight:var(--dialogue-weight);color:var(--text)}
.bubble .roleplay{color:var(--roleplay);opacity:var(--roleplay-opacity);font-style:italic}
.bubble .roleplay,.bubble .speech{white-space:pre-wrap}
.composer{position:sticky;bottom:var(--navh,74px);z-index:4;padding:10px 0;background:linear-gradient(transparent,var(--bg) 18%)}
.composer .row{align-items:flex-end}
.composer textarea{flex:1;min-height:46px;max-height:120px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text);padding:12px}
.color-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.color-row input[type=color]{width:54px;height:42px;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.notice{background:#302515;border:1px solid #715529;color:#ffe3a4;border-radius:12px;padding:12px;font-size:13px;line-height:1.4}
.status{display:none}
.title{font-size:34px;font-weight:700;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ibtn{background:none;border:0;color:var(--text);padding:8px;display:grid;place-items:center}
.pills{display:flex;gap:10px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1.5px solid var(--line);background:none;color:var(--text);border-radius:999px;padding:13px 24px;font-size:17px}
.pill.on{background:#f4f4f4;color:#111;border-color:#f4f4f4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
.gcard{background:none;border:0;padding:0;text-align:left;color:var(--text);min-width:0}
.gimg{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:26px;object-fit:cover;font-size:56px;font-weight:700;background:var(--panel2);color:#fff}
.gt{font-size:21px;font-weight:700;margin:10px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd{color:var(--muted);font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.gm{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden}
.hitem{display:flex;align-items:center;gap:18px;width:100%;background:none;border:0;color:var(--text);text-align:left;padding:10px 0}
.himg{position:relative;flex:0 0 86px;width:86px;height:86px}
.himg .gimg{border-radius:20px;font-size:32px}
.heart{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;color:#ccc}
.hname{font-size:22px;font-weight:600}
.hsn{color:var(--muted);font-size:14px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:58vw}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:space-around;align-items:center;padding:14px 10px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.nav button{background:none;border:0;color:#cfcfcf;padding:4px;display:grid;place-items:center}
.nav button.on{color:#fff}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid transparent;background:var(--panel2);display:grid;place-items:center}
.nav .on .av{border-color:#fff}
.sheet{position:fixed;inset:0;z-index:7;background:var(--bg);overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 22px calc(var(--navh,74px) + 20px)}
.sheet h3{text-align:center;font-size:30px;margin:6px 0 22px}
.sheet.pop{inset:auto 0 var(--navh,74px) 0;border-radius:22px 22px 0 0;border:1px solid var(--line);background:var(--panel);padding:14px 22px;box-shadow:0 -10px 40px #000a}
.srow{display:flex;align-items:center;gap:22px;width:100%;background:none;border:0;color:var(--text);font-size:26px;font-weight:500;padding:17px 4px;text-align:left}
.pop .srow{font-size:20px;padding:14px 4px}
.srow.off{color:#6b6b6b}
.badge{font-size:15px;border:1.5px solid #777;color:#bbb;border-radius:999px;padding:5px 13px}
.toast{position:fixed;left:50%;bottom:calc(var(--navh,74px) + 18px);transform:translateX(-50%);background:#f4f4f4;color:#111;padding:12px 18px;border-radius:999px;font-size:15px;z-index:20;max-width:90vw;text-align:center}
.pav{width:150px;height:150px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font-size:56px}
.pname{font-size:42px;font-weight:700;margin:16px 0}
.stats{display:flex;gap:30px}
.stats b{display:block;font-size:30px}
.stats span{color:var(--muted);font-size:17px}
.pbtns{display:flex;gap:12px;margin:18px 0}
.obtn{flex:1;border:1.5px solid var(--line);background:none;color:var(--text);border-radius:999px;padding:14px 8px;font-size:17px}
.circ{flex:0 0 52px;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--text);display:grid;place-items:center}
.search{display:flex;gap:12px;margin:14px 0}
.search .box{flex:1;display:flex;align-items:center;gap:10px;background:#2b2b2b;border-radius:999px;padding:0 18px;color:var(--muted)}
.search input{flex:1;background:none;border:0;color:var(--text);padding:15px 0;outline:none;font-size:18px;min-width:0}
.pitem{display:flex;align-items:center;gap:14px;background:#1c1c1c;border-radius:22px;padding:14px;margin-bottom:12px}
.pitem .gimg{flex:0 0 74px;width:74px;height:74px;border-radius:14px;font-size:28px}
.pinfo{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--text);padding:0}
.pinfo b{display:block;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{flex:0 0 50px;width:50px;height:50px;border-radius:50%;border:0;background:#2f2f2f;color:var(--text);display:grid;place-items:center}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ctop .gimg{width:44px;height:44px;aspect-ratio:auto;flex:0 0 44px;border-radius:12px;font-size:20px}
.ctop .nm{flex:1;min-width:0}
.ctop h2{margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--text);padding:16px;font-size:18px;text-align:left;margin-bottom:12px}
body.inchat .nav{display:none}
body.inchat main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(88px + env(safe-area-inset-top)) 14px 0}
body.inchat .messages{flex:1}
body.inchat .ctop{position:fixed;top:0;left:0;right:0;z-index:9;margin:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
body.inchat .ctop .gimg,body.inchat .ctop .nm{cursor:pointer}
body.inchat .composer{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.csb{position:fixed;inset:0;z-index:11;background:rgba(0,0,0,.6)}
.sheet.pop.cs{z-index:12;bottom:0;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.csx{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;font-size:18px}
.csav{display:grid;place-items:center;width:96px;height:96px;border-radius:18px;object-fit:cover;font-size:38px;font-weight:700;color:#fff;margin:6px auto 10px}
.csn{font-size:22px;font-weight:700;text-align:center}
.csr{display:flex;align-items:center;gap:14px;width:100%;background:#1f1f1f;border:0;border-radius:16px;color:var(--text);padding:16px;font-size:17px;text-align:left;margin-top:10px}
.csr.blue{color:#4d8dff}
.csd{white-space:pre-wrap;max-height:42vh;overflow:auto;background:#1f1f1f;border-radius:16px;padding:14px;margin-top:12px;line-height:1.5;font-size:15px}
.tg{-webkit-appearance:none;appearance:none;flex:0 0 52px;width:52px;height:30px;border-radius:15px;background:#555;position:relative;margin:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg:checked{background:#2f6bff}
.tg:checked::after{left:25px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="status" class="status"></div>
<main id="app"></main>
<div id="sheet" class="sheet hidden"></div>
<nav class="nav" id="nav"></nav>
<script>
const STORE='monIAPrive_v1',SETTINGS='monIAPrive_settings_v1',APPEAR='monIAPrive_appearance_v1',PROF='monIAPrive_profile_v1';
let chars=[],settings={apiKey:'',model:'openrouter/free',nsfw:false,gore:false,customInstructions:''},appearance={theme:'dark',bgColor:'#111111',panelColor:'#1d1d1d',textColor:'#ffffff',userBubble:'#6344e8',botBubble:'#262626',roleplayColor:'#a3a3a3',dialogueBold:true,roleplayOpacity:78,bgImage:''},profile={name:'Moi',photo:'',persona:''};
let tab='home',page='home',cat='Tous',hFilter='recent',hQuery='',hSearch=false,pQuery='',activeId=null,editId=null,busy=false;
const CATS=['Tous','Scènes','Anime','Assistant','Créatif'];
const SUGG=[
{id:'s1',cat:'Assistant',name:'Assistant polyvalent',tag:'Clair, patient, efficace',greeting:'Bonjour ! Sur quoi puis-je t’aider aujourd’hui ?',description:'Tu es un assistant polyvalent, clair, bienveillant et précis. Tu poses une question quand il manque une information.'},
{id:'s2',cat:'Assistant',name:'Coach motivation',tag:'Objectifs, habitudes, énergie',greeting:'Salut champion ! Quel objectif veux-tu atteindre ?',description:'Tu es un coach motivant et pragmatique. Tu aides à fixer des objectifs réalistes et à passer à l’action.'},
{id:'s3',cat:'Assistant',name:'Prof de langues',tag:'Apprends en discutant',greeting:'Hello ! Quelle langue veux-tu pratiquer ?',description:'Tu es un professeur de langues patient. Tu corriges avec douceur et tu proposes de petits exercices.'},
{id:'s4',cat:'Créatif',name:'Conteur d’aventures',tag:'Des histoires dont tu es le héros',greeting:'*Le feu crépite.* Prêt à vivre une aventure ? Dis-moi qui tu es.',description:'Tu es un maître du jeu qui raconte des aventures interactives, avec des choix à chaque étape.'},
{id:'s5',cat:'Scènes',name:'Détective privé',tag:'Enquête dans une ville sous la pluie',greeting:'*Il referme son carnet.* Asseyez-vous. Qu’est-ce qui vous amène ?',description:'Tu es un détective privé cynique mais loyal, dans une ville noire et pluvieuse des années 40. Tu mènes l’enquête avec l’utilisateur.'},
{id:'s6',cat:'Anime',name:'Sensei du dojo',tag:'Discipline et sagesse',greeting:'*Il s’incline.* Bienvenue au dojo. Que viens-tu apprendre ?',description:'Tu es un sensei sage et exigeant, mais juste. Tu parles avec calme et tu donnes des leçons de vie.'}
];
const IC={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
chat:'<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-1-2z"/>',
plus:'<circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7z"/>',
userplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M19 8v6M16 11h6"/>',
persona:'<path d="M3 6h12M3 11h8M3 16h5"/><path d="M14 20l7-7-3-3-7 7-1 4z"/>',
book:'<path d="M12 6c-2-2-6-2-9-1v14c3-1 7-1 9 1 2-2 6-2 9-1V5c-3-1-7-1-9 1zM12 6v14"/>',
scene:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 8v4M10 10h4"/>',
group:'<rect x="3" y="3" width="14" height="10" rx="2"/><path d="M7 17h10l4 3V9h-3"/>',
film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/>',
voice:'<path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>',
cast:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 11l5-3v8l-5-3z"/>',
comic:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 11h18M11 3v8"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/>',
dots:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
edit:'<path d="M4 20l1-4 11-11 3 3-11 11z"/>',
sliders:'<path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
open:'<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-1-2z"/>'
};
const ic=(n,f,s)=>`<svg viewBox="0 0 24 24" width="${s||28}" height="${s||28}" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function updateNavH(){const n=document.querySelector('.nav');if(n)document.documentElement.style.setProperty('--navh',n.offsetHeight+'px')}
function scrollBottom(){setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50)}
let toastTimer=null;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2200)}
function load(){
try{chars=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{chars=[]}
if(!Array.isArray(chars))chars=[];
try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch{}
try{appearance={...appearance,...JSON.parse(localStorage.getItem(APPEAR)||'{}')}}catch{}
try{profile={...profile,...JSON.parse(localStorage.getItem(PROF)||'{}')}}catch{}
applyAppearance();
}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(chars))}catch(e){alert('Stockage plein. Essaie une photo plus petite ou exporte tes données.')}}
function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(settings))}
function saveAppearance(){localStorage.setItem(APPEAR,JSON.stringify(appearance));applyAppearance()}
function saveProfile(){try{localStorage.setItem(PROF,JSON.stringify(profile))}catch(e){alert('Stockage plein. Essaie une photo plus petite.')}}
function applyAppearance(){const r=document.documentElement;r.style.setProperty('--bg',appearance.bgColor);r.style.setProperty('--panel',appearance.panelColor);r.style.setProperty('--text',appearance.textColor);r.style.setProperty('--user-bubble',appearance.userBubble);r.style.setProperty('--bot-bubble',appearance.botBubble);r.style.setProperty('--roleplay',appearance.roleplayColor);r.style.setProperty('--roleplay-opacity',Number(appearance.roleplayOpacity)/100);r.style.setProperty('--dialogue-weight',appearance.dialogueBold?'700':'400');r.style.setProperty('--chat-bg-image',appearance.bgImage?`url("${appearance.bgImage}")`:'none');if(appearance.theme==='light'&&(appearance.bgColor==='#111111'||appearance.bgColor==='#080c16')){r.style.setProperty('--bg','#f3f4fa');r.style.setProperty('--panel','#ffffff');r.style.setProperty('--text','#202338')}}
function getChar(id){return chars.find(c=>c.id===id)}
function grad(n){let h=0;const s=String(n||'?');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return `linear-gradient(135deg,hsl(${h},55%,40%),hsl(${(h+45)%360},60%,22%))`}
function av(c,cls){cls=cls||'gimg';return c.photo?`<img class="${cls}" src="${c.photo}" alt="">`:`<div class="${cls}" style="background:${grad(c.name)}">${esc(String(c.name||'?').trim().charAt(0).toUpperCase())}</div>`}
function lastTs(c){const m=c.messages||[];return (m.length?m[m.length-1].at:0)||c.created||0}
function ago(t){if(!t)return '';const m=Math.floor((Date.now()-t)/60000);if(m<1)return 'À l’instant';if(m<60)return 'Il y a '+m+' min';const h=Math.floor(m/60);if(h<24)return 'Il y a '+h+' h';const d=Math.floor(h/24);if(d<30)return 'Il y a '+d+' j';return 'Il y a '+Math.floor(d/30)+' mois'}
function renderNav(){
const items=[['home','home'],['history','chat'],['create','plus'],['profile','user']];
const names={home:'Accueil',history:'Discussions',create:'Créer',profile:'Profil'};
$('#nav').innerHTML=items.map(([k,i])=>{
const on=tab===k&&k!=='create';
const inner=k==='profile'?(profile.photo?`<img class="av" src="${profile.photo}" alt="">`:`<div class="av">${ic('user')}</div>`):ic(i,on&&(k==='home'||k==='history'),32);
return `<button type="button" data-tab="${k}" class="${on?'on':''}" aria-label="${names[k]}">${inner}</button>`;
}).join('');
updateNavH();
}
let pSort='recent';
function backTab(){page=tab;activeId=null;editId=null;render()}

function shrinkImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,700/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function formatMessage(text){const lines=String(text||'').split('\n');return lines.map(line=>{const t=line.trim();if(!t)return '';const isRole=/^(\*.*\*|_.*_|（.*）|\(.*\))$/.test(t);return `<span class="${isRole?'roleplay':'speech'}">${esc(line)}</span>`}).join('\n')}
async function copyText(text){
try{
if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}
}catch(e){}
try{
const area=document.createElement('textarea');
area.value=text;
area.setAttribute('readonly','');
area.style.position='fixed';
area.style.top='0';
area.style.left='0';
area.style.opacity='0';
area.style.fontSize='16px';
document.body.appendChild(area);
area.focus();
area.select();
area.setSelectionRange(0,area.value.length);
const ok=document.execCommand('copy');
area.remove();
return ok;
}catch(e){return false}
}

async function sendMessage(id){
if(busy)return;
const c=getChar(id),input=$('#messageInput');
if(!c||!input)return;
const text=input.value.trim();
if(!text)return;
if(!settings.apiKey){alert('Ajoute une clé API dans Réglages IA pour activer les réponses.');tab='profile';page='settings';render();return}
if(!Array.isArray(c.messages))c.messages=[];
c.messages.push({role:'user',text,at:Date.now()});
persist();busy=true;renderChat();
try{
const history=c.messages.filter(m=>!String(m.text).startsWith('[Erreur de génération]')).slice(-16).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
const modeRules=[settings.nsfw?"Thèmes adultes : les personnages impliqués doivent être explicitement adultes et consentants.":"Évite les scènes sexuelles explicites.",settings.gore?"Horreur et violence fictives décrites de façon narrative.":"Limite les descriptions graphiques de violence."].join('\n');
const lang=c.language==='en'?'English. Reply only in natural English.':c.language==='auto'?'Reply in the same language as the latest user message.':'French. Réponds uniquement en français naturel.';
const who=profile.persona?`\nL’utilisateur s’appelle ${profile.name}. À propos de lui : ${profile.persona}`:'';
const system=`Tu incarnes ${c.name}. Description/personnalité :\n${c.description}\nSalutation : ${c.greeting}${who}\nLANGUE : ${lang}\nRÈGLES DE RÉPONSE : écris des réponses complètes et naturelles, avec des phrases et paragraphes terminés. Ne coupe jamais volontairement une phrase. Développe la scène avec assez de détails, sans résumer ni répéter. Si tu approches de la limite, termine la phrase et le paragraphe avant de conclure. En roleplay, tu peux distinguer les actions entre astérisques et les paroles en texte normal. Reste fidèle au personnage.\nPréférences :\n${modeRules}\nInstructions personnalisées : ${settings.customInstructions||'Aucune'}`;
const model=settings.model||'openrouter/free';
let reply='';
let messages=[{role:'system',content:system},...history];
for(let attempt=0;attempt<2;attempt++){
const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+settings.apiKey,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'Mon IA Privée'},body:JSON.stringify({model,messages,temperature:.85,max_tokens:attempt===0?1200:800,stream:false})});
const data=await res.json();
if(!res.ok)throw new Error(data?.error?.message||`Erreur API (${res.status})`);
const choice=data.choices?.[0],content=choice?.message?.content;
const part=content?(Array.isArray(content)?content.map(x=>x.text||'').join(''):String(content)).trim():'';
if(part)reply+=(attempt>0&&reply?' ':'')+part;
if(!reply)throw new Error('Le modèle n’a renvoyé aucune réponse. Essaie un autre modèle gratuit.');
if(choice?.finish_reason!=='length'||attempt===1||!part)break;
messages=[...messages,{role:'assistant',content:part},{role:'user',content:'Continue exactement à partir de la fin de ta réponse précédente. Ne répète rien. Termine les phrases et le paragraphe naturellement.'}];
}
if(!reply)throw new Error('Réponse vide du modèle.');
const cc=getChar(id);
if(cc){cc.messages.push({role:'assistant',text:reply,at:Date.now()});persist()}
}catch(err){
const cc=getChar(id);
if(cc){cc.messages.push({role:'assistant',text:'[Erreur de génération] '+err.message,at:Date.now()});persist()}
}finally{
busy=false;
if(page==='chat'&&activeId===id)renderChat();
}
}
function readFileText(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('Lecture impossible'));r.readAsText(file)})}
function renderSettings(){
$('#app').innerHTML=`<h2>Réglages IA</h2><div class="notice">Les modes ajustent les instructions envoyées au modèle et ne remplacent pas ses propres règles.</div><div class="card stack" style="margin-top:12px"><label class="row" style="justify-content:space-between"><span><strong>Mode NSFW / thèmes adultes</strong><div class="muted">Romance et ton sensuel entre adultes consentants.</div></span><input id="nsfwMode" type="checkbox" ${settings.nsfw?'checked':''} style="width:24px;height:24px"></label><label class="row" style="justify-content:space-between"><span><strong>Mode Gore / horreur</strong><div class="muted">Horreur fictive et violence narrative.</div></span><input id="goreMode" type="checkbox" ${settings.gore?'checked':''} style="width:24px;height:24px"></label><div class="field"><label for="customInstructions">Instructions personnalisées</label><textarea id="customInstructions" maxlength="6000">${esc(settings.customInstructions||'')}</textarea></div></div><div class="field"><label for="apiKey">Clé API OpenRouter</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-v1-…" value="${esc(settings.apiKey)}"><div class="muted">Stockée localement dans ce navigateur. Ne partage jamais cette clé.</div><a href="https://openrouter.ai/keys" target="_blank" rel="noopener" style="color:#b6a6ff">Gérer la clé ↗</a></div><div class="field"><label for="model">Modèle</label><input id="model" value="${esc(settings.model||'openrouter/free')}"><a href="https://openrouter.ai/models?max_price=0" target="_blank" rel="noopener" style="color:#b6a6ff">Voir les modèles gratuits ↗</a></div><div class="actions"><button class="btn" type="button" id="saveSettings">Enregistrer</button><button class="btn secondary" type="button" id="testBtn">Tester la connexion</button></div><div id="testResult" class="muted" style="margin-top:12px"></div>`;
const save=()=>{
settings.apiKey=$('#apiKey').value.trim();
settings.model=$('#model').value.trim()||'openrouter/free';
settings.nsfw=$('#nsfwMode').checked;
settings.gore=$('#goreMode').checked;
settings.customInstructions=$('#customInstructions').value.trim();
saveSettings();
};
$('#saveSettings').onclick=()=>{save();$('#testResult').textContent='Réglages enregistrés.'};
$('#testBtn').onclick=async()=>{
save();
$('#testResult').textContent='Test en cours…';
try{
const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+settings.apiKey,'Content-Type':'application/json'},body:JSON.stringify({model:settings.model,messages:[{role:'user',content:'Réponds uniquement : Connexion réussie.'}],max_tokens:40})});
const d=await r.json();
$('#testResult').textContent=r.ok?'Connexion réussie : '+((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'réponse reçue'):'Échec : '+((d.error&&d.error.message)||r.status);
}catch(e){$('#testResult').textContent='Erreur réseau : '+e.message}
};
}
function renderAppearance(){
$('#app').innerHTML=`<h2>Apparence</h2><div class="card stack"><div class="field"><label for="theme">Thème</label><select id="theme"><option value="dark" ${appearance.theme==='dark'?'selected':''}>Sombre</option><option value="light" ${appearance.theme==='light'?'selected':''}>Clair</option><option value="custom" ${appearance.theme==='custom'?'selected':''}>Personnalisé</option></select></div><div class="field"><label>Couleur de fond</label><div class="color-row"><input type="color" id="bgColor" value="${appearance.bgColor}"><span class="muted">Arrière-plan général</span></div></div><div class="field"><label>Couleur des panneaux</label><div class="color-row"><input type="color" id="panelColor" value="${appearance.panelColor}"><span class="muted">Cartes et bulles IA</span></div></div><div class="field"><label>Couleur du texte</label><div class="color-row"><input type="color" id="textColor" value="${appearance.textColor}"></div></div><div class="field"><label>Couleur des bulles utilisateur</label><div class="color-row"><input type="color" id="userBubble" value="${appearance.userBubble}"></div></div><div class="field"><label>Couleur des bulles IA</label><div class="color-row"><input type="color" id="botBubble" value="${appearance.botBubble}"></div></div><div class="field"><label>Couleur de la narration / roleplay</label><div class="color-row"><input type="color" id="roleplayColor" value="${appearance.roleplayColor}"></div></div><label class="row"><input id="dialogueBold" type="checkbox" ${appearance.dialogueBold?'checked':''} style="width:22px;height:22px"> Paroles en gras</label><div class="field"><label for="roleplayOpacity">Opacité du roleplay : <span id="opacityValue">${appearance.roleplayOpacity}%</span></label><input id="roleplayOpacity" type="range" min="20" max="100" value="${appearance.roleplayOpacity}"></div><div class="field"><label for="bgPhoto">Arrière-plan depuis Photos</label><input id="bgPhoto" type="file" accept="image/*"><div class="muted">L’image est stockée sur cet appareil. Une grande image peut remplir le stockage local.</div><button class="btn secondary" type="button" id="removeBg">Retirer l’image de fond</button></div><div class="actions"><button class="btn" type="button" id="saveAppearance">Enregistrer l’apparence</button></div><div class="muted">Les réglages d’apparence sont propres à ce navigateur.</div></div>`;
const ids=['bgColor','panelColor','textColor','userBubble','botBubble','roleplayColor','theme','dialogueBold','roleplayOpacity'];
const read=()=>{
appearance.bgColor=$('#bgColor').value;
appearance.panelColor=$('#panelColor').value;
appearance.textColor=$('#textColor').value;
appearance.userBubble=$('#userBubble').value;
appearance.botBubble=$('#botBubble').value;
appearance.roleplayColor=$('#roleplayColor').value;
appearance.theme=$('#theme').value;
appearance.dialogueBold=$('#dialogueBold').checked;
appearance.roleplayOpacity=Number($('#roleplayOpacity').value);
$('#opacityValue').textContent=appearance.roleplayOpacity+'%';
applyAppearance();
};
ids.forEach(id=>{$('#'+id).addEventListener('input',read);$('#'+id).addEventListener('change',read)});
$('#saveAppearance').onclick=()=>{read();saveAppearance();alert('Apparence enregistrée.')};
$('#bgPhoto').onchange=async e=>{
const f=e.target.files&&e.target.files[0];
if(!f)return;
try{appearance.bgImage=await shrinkImage(f);applyAppearance()}catch(err){alert('Impossible de lire cette image.')}
};
$('#removeBg').onclick=()=>{appearance.bgImage='';applyAppearance();$('#bgPhoto').value=''};
}
function renderPrivacy(){
$('#app').innerHTML=`<h2>Confidentialité & sauvegardes</h2><div class="card stack"><strong>Stockage local</strong><div class="muted">Personnages, photos, descriptions et historiques restent dans le navigateur de cet appareil. Ils ne se synchronisent pas automatiquement.</div><strong>Envoi au fournisseur IA</strong><div class="muted">La description du personnage et les derniers messages sont envoyés au fournisseur choisi pour générer une réponse. Évite les informations sensibles.</div><strong>Important</strong><div class="muted">Le stockage local n'est pas un coffre-fort. Exporte régulièrement une sauvegarde. Les paramètres visuels, le profil et la clé API ne sont pas inclus dans l'export.</div><div class="actions"><button class="btn" type="button" id="exportBtn">Exporter une sauvegarde</button><label class="btn secondary" for="importFile" style="display:inline-flex;align-items:center">Importer une sauvegarde</label><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div><button class="btn danger" type="button" id="clearBtn">Supprimer toutes les données locales</button></div>`;
$('#exportBtn').onclick=async()=>{
const json=JSON.stringify({version:2,characters:chars,settings:{model:settings.model}},null,2);
const fileName='mon-ia-privee-sauvegarde.json';
try{
const file=new File([json],fileName,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[file]})){
await navigator.share({files:[file],title:'Sauvegarde Mon IA Privée'});
return;
}
}catch(err){
if(err&&err.name==='AbortError')return;
}
const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('#importFile').onchange=async e=>{
const input=e.target;
const f=input.files&&input.files[0];
if(!f)return;
try{
const d=JSON.parse(await readFileText(f));
if(!d||!Array.isArray(d.characters))throw new Error('Fichier invalide');
if(confirm('Remplacer les personnages actuels par la sauvegarde ?')){
chars=d.characters.filter(x=>x&&typeof x==='object').map(x=>({...x,id:x.id||uid(),name:String(x.name||'Sans nom'),greeting:String(x.greeting||''),description:String(x.description||''),language:x.language||'fr',messages:Array.isArray(x.messages)?x.messages:[]}));
persist();tab='home';page='home';render();
}
}catch(err){alert('Import impossible : '+err.message)}
input.value='';
};
$('#clearBtn').onclick=()=>{
if(confirm('Supprimer définitivement les personnages, photos et conversations stockés dans ce navigateur ?')){chars=[];persist();tab='home';page='home';render()}
};
}
document.addEventListener('click',function(e){
const t=e.target,g=s=>t.closest?t.closest(s):null;
if(page==='chat'&&$('#sheet').classList.contains('hidden')&&g('.ctop .nm, .ctop .gimg')){chatSheet('menu');return}
const el=g('[data-cs]');
if(!el)return;
const c=getChar(activeId);
if(!c)return;
const k=el.dataset.cs;
if(k==='close')closeSheet();
else if(k==='menu')chatSheet('menu');
else if(k==='char')chatSheet('char');
else if(k==='creator')chatSheet('creator');
else if(k==='edit'){editId=c.id;page='editor';render()}
else if(k==='refresh'){
closeSheet();
const m=c.messages||[];
if(m.length&&String(m[m.length-1].text).startsWith('[Erreur de génération]')){m.pop();persist()}
renderChat();
toast('Chat actualisé');
}else if(k==='new'){
if(confirm('Effacer cette conversation et recommencer avec la salutation ?')){c.messages=[];persist();closeSheet();renderChat();toast('Nouveau chat démarré')}
}
},true);
document.addEventListener('change',function(e){
if(e.target&&e.target.id==='absTg'){
const c=getChar(activeId);
if(c){c.absence=e.target.checked;persist();toast(c.absence?'Messages d’absence activés':'Messages d’absence désactivés')}
}
});
document.addEventListener('click',e=>{
const t=e.target,g=s=>t.closest?t.closest(s):null;
const sh=$('#sheet');
if(!sh.classList.contains('hidden')&&sh.classList.contains('pop')&&!g('#sheet')&&!g('[data-menu]')){closeSheet();return}
let el;
if((el=g('[data-m]'))){
const k=el.dataset.m,id=el.dataset.id,c=getChar(id);
if(k==='open'&&c){activeId=id;page='chat';render()}
else if(k==='edit'&&c){editId=id;page='editor';render()}
else if(k==='del'&&c){if(confirm('Supprimer définitivement '+c.name+' et sa conversation ?')){chars=chars.filter(x=>x.id!==id);persist();render()}else closeSheet()}
else closeSheet();
return;
}
if((el=g('[data-create]'))){
if(el.dataset.create==='char'){editId=null;page='editor';render()}
else{tab='profile';page='editProfile';render()}
return;
}
if(g('[data-soon]')){toast('Bientôt disponible');return}
if((el=g('[data-menu]'))){openMenu(el.dataset.menu);return}
if((el=g('[data-open]'))){activeId=el.dataset.open;page='chat';render();return}
if((el=g('[data-sugg]'))){
const s=SUGG.find(x=>x.id===el.dataset.sugg);
if(!s)return;
let c=chars.find(x=>x.from===s.id);
if(!c){c={id:uid(),from:s.id,own:false,name:s.name,greeting:s.greeting,description:s.description,cat:s.cat,photo:null,language:'fr',messages:[],created:Date.now()};chars.unshift(c);persist()}
activeId=c.id;page='chat';render();
return;
}
if((el=g('[data-cat]'))){cat=el.dataset.cat;render();return}
if((el=g('[data-hf]'))){hFilter=el.dataset.hf;render();return}
if((el=g('[data-act]'))){
const a=el.dataset.act;
if(a==='hsearch'){hSearch=!hSearch;if(!hSearch)hQuery='';render();const i=$('#hq');if(i)i.focus()}
else if(a==='bell'){toast('Aucune notification')}
else if(a==='editprofile'){page='editProfile';render()}
else if(a==='backups'){page='privacy';render()}
else if(a==='hub'){page='hub';render()}
else if(a==='sort'){pSort=pSort==='recent'?'az':'recent';toast(pSort==='az'?'Tri : A à Z':'Tri : plus récents');$('#plist').innerHTML=pHtml()}
return;
}
if((el=g('[data-page]'))){page=el.dataset.page;render();return}
if((el=g('[data-tab]'))){
const k=el.dataset.tab;
if(k==='create'){if($('#sheet').classList.contains('hidden'))openCreate();else closeSheet();return}
tab=k;page=k;activeId=null;editId=null;render();
}
});
load();
render();
window.addEventListener('resize',updateNavH);
window.addEventListener('load',updateNavH);
</script>
